<!doctype html>
<html lang="en">
  <head>
    <title>鬆餅</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">

    <link type="text/css" href="./styles.css" rel="stylesheet"/>

  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="pan.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" auto-rotate>
      <button class="Hotspot" slot="hotspot-1" data-position="0.05608939419911549m 0.3374835923647848m 0.050598284761035686m" data-normal="-0.2501530841849183m 0.7198869389914425m 0.6474459278907424m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">輝耀最愛的鬆餅(?</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
